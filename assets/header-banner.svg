<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" width="100%" height="230" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');

      .name-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 30px;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }

      .role-badge {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-weight: 600;
        font-size: 11px;
        fill: #38BDF8;
        letter-spacing: 1.5px;
      }

      .sub-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
        fill: #94A3B8;
        letter-spacing: -0.2px;
      }

      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 11.5px;
        fill: #E2E8F0;
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.75; }
      }

      .glow-layer {
        animation: pulseGlow 4s ease-in-out infinite;
      }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <radialGradient id="radialCyan" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialIndigo" cx="10%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="940" height="230" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Subtle Dot Grid Matrix -->
  <rect x="2" y="2" width="936" height="226" rx="10" fill="url(#dotPattern)" />

  <!-- Ambient Glow Highlights -->
  <rect width="940" height="230" rx="12" fill="url(#radialCyan)" class="glow-layer" />
  <rect width="940" height="230" rx="12" fill="url(#radialIndigo)" class="glow-layer" />

  <!-- Top Accent Bar -->
  <path d="M 12 1 L 928 1" stroke="url(#radialCyan)" stroke-width="2" stroke-linecap="round" />

  <!-- Content Group -->
  <g transform="translate(42, 42)">
    <!-- Role Eyebrow Tag -->
    <rect x="0" y="0" width="235" height="24" rx="12" fill="#0C4A6E" fill-opacity="0.35" stroke="#0284C7" stroke-width="0.8" />
    <circle cx="12" cy="12" r="4" fill="#38BDF8" />
    <text x="24" y="16" class="role-badge">RESEARCHER &amp; DEVELOPER</text>

    <!-- Main Name -->
    <text x="0" y="56" class="name-text">Mamidala Som Praneeth Babu</text>

    <!-- Affiliation / Academic Track -->
    <text x="0" y="82" class="sub-text">B.Tech CSE (Artificial Intelligence) • Amrita Vishwa Vidyapeetham, Coimbatore</text>

    <!-- Project Focus Feature Pills -->
    <g transform="translate(0, 110)">
      <!-- Pill 1: Computer Vision -->
      <rect x="0" y="0" width="180" height="28" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" class="pill-text">🔬 Vision &amp; Deblurring</text>

      <!-- Pill 2: Mechanistic Interpretability -->
      <rect x="192" y="0" width="180" height="28" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" class="pill-text" transform="translate(192, 0)">🧠 LLM Causal Tracing</text>

      <!-- Pill 3: Autonomous Robotics -->
      <rect x="384" y="0" width="175" height="28" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" class="pill-text" transform="translate(384, 0)">🛸 Autonomous Drones</text>

      <!-- Pill 4: Coast on Google Play -->
      <rect x="571" y="0" width="225" height="28" rx="14" fill="#064E3B" fill-opacity="0.7" stroke="#10B981" stroke-width="1" />
      <text x="14" y="18" class="pill-text" style="fill: #6EE7B7;" transform="translate(571, 0)">🚀 Coast on Google Play</text>
    </g>
  </g>

  <!-- Right Decorative Subtle Graphic -->
  <g transform="translate(810, 50)" opacity="0.35">
    <circle cx="45" cy="45" r="40" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 4" />
    <circle cx="45" cy="45" r="26" fill="none" stroke="#6366F1" stroke-width="1.2" />
    <circle cx="45" cy="45" r="8" fill="#38BDF8" />
  </g>
</svg>
